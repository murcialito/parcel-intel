[project]
name = "parcel-intel"
version = "0.1.0"
description = "Mapa abierto de caminos públicos y vías pecuarias con indicios de cortes"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.1",
    "tifffile>=2024.1",
    "numpy>=1.26",
    "pyproj>=3.6",
    "pydantic>=2.0",
    "shapely>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "types-requests",
    "httpx>=0.27",
    "types-shapely>=2.2.0.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_intel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests que llaman a red real o a una base de datos PostGIS local (excluidos por defecto)",
    "acceptance: tests de aceptación, uno por criterio Dado/Cuando/Entonces de una historia (tests/acceptance/)",
    "red: llaman en vivo a un servicio público externo (IGN, IDEE, PNOA, CNIG, IDEM...); CI los ejecuta en un job aparte que no bloquea el merge, para que la caída de un servicio ajeno no pare la tubería",
    "fuera_de_ci: necesitan un servicio real que rechaza los runners de GitHub Actions (p. ej. el WFS de Catastro); CI no los ejecuta y se pasan en local antes de fusionar",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.importlinter]
root_packages = ["parcel_intel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Arquitectura hexagonal: capas y dirección de dependencia"
type = "layers"
layers = [
    "parcel_intel.cli | parcel_intel.api",
    "parcel_intel.adapters",
    "parcel_intel.application",
    "parcel_intel.ports",
    "parcel_intel.domain",
]

[[tool.importlinter.contracts]]
name = "El dominio no importa nada de terceros ni de otras capas"
type = "forbidden"
source_modules = ["parcel_intel.domain"]
forbidden_modules = [
    "parcel_intel.ports",
    "parcel_intel.application",
    "parcel_intel.adapters",
    "parcel_intel.cli",
    "parcel_intel.api",
    "requests",
    "pydantic",
    "psycopg",
    "numpy",
    "tifffile",
    "pyproj",
    "shapely",
]
