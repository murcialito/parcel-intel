[project]
name = "parcel-intel"
version = "0.1.0"
description = "Due diligence legal y física de inmuebles a partir de una referencia catastral"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_intel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests que llaman a red real (excluidos por defecto)",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.importlinter]
root_packages = ["parcel_intel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Arquitectura hexagonal: capas y dirección de dependencia"
type = "layers"
layers = [
    "parcel_intel.cli",
    "parcel_intel.adapters",
    "parcel_intel.application",
    "parcel_intel.ports",
    "parcel_intel.domain",
]

[[tool.importlinter.contracts]]
name = "El dominio no importa nada de terceros ni de otras capas"
type = "forbidden"
source_modules = ["parcel_intel.domain"]
forbidden_modules = [
    "parcel_intel.ports",
    "parcel_intel.application",
    "parcel_intel.adapters",
    "parcel_intel.cli",
    "requests",
    "pydantic",
]
