name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # PostGIS efímero para los criterios de aceptación [integración: PostGIS local]. Sin coste.
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: parcel_intel
          POSTGRES_USER: parcel_intel
          POSTGRES_PASSWORD: parcel_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcel_intel -d parcel_intel"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Veto del fundador
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'veto')
        run: |
          echo "::error::La PR tiene la etiqueta 'veto': el merge automático queda bloqueado."
          exit 1

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Tipado estricto
        run: uv run mypy

      - name: Capas hexagonales
        run: uv run lint-imports

      - name: Tests unitarios
        run: uv run pytest

      - name: Migraciones de PostGIS
        run: uv run python -m parcel_intel.adapters.postgis.migrate up

      - name: Tests de aceptación
        run: |
          set +e
          # fuera_de_ci: servicios que rechazan los runners de GitHub (Catastro); se pasan en local.
          # red: servicios públicos en vivo; van en el job red-externa, que no bloquea el merge.
          uv run pytest -m "acceptance and not fuera_de_ci and not red"
          code=$?
          # 5 = ningún test recogido (todavía no hay tests de aceptación): no es un fallo.
          if [ "$code" -eq 5 ]; then exit 0; fi
          exit "$code"

  red-externa:
    # Tests que llaman en vivo a servicios públicos (IGN, IDEE, PNOA, CNIG, IDEM). Si el servicio cae o
    # va lento, todas las PRs se quedaban en rojo sin culpa suya: el 2026-11-27, IDEE agotaba el tiempo
    # y #169 gastó cuatro vueltas marcando tests ajenos. Aquí se ejecutan y su check se ve, pero
    # `continue-on-error` deja el run de CI en verde. Fusionar solo exige el check `checks`, y el
    # job ci-rojo no salta por esto.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias
        run: uv sync --frozen --extra dev

      - name: Tests contra servicios públicos en vivo
        run: |
          set +e
          uv run pytest -m "acceptance and red and not fuera_de_ci"
          code=$?
          if [ "$code" -eq 5 ]; then exit 0; fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::Fallan tests contra servicios públicos en vivo. No bloquea el merge: mira si es una caída del servicio o un cambio real de su respuesta."
          fi
          exit "$code"
