name: Desarrollar

# Agente desarrollador. Hasta HISTORIAS_EN_PARALELO historias a la vez (variable de repo, por defecto 1):
# - "seleccionar" (en serie) elige la siguiente historia lista que no se solape con las que están en
#   curso, la marca estado:en-desarrollo y, si queda hueco, se relanza para llenarlo;
# - "desarrollar" la implementa y abre la PR (la fusiona fusionar.yml, nunca el agente);
# - "corregir" atiende la etiqueta cambios-pedidos que pone el revisor.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  seleccionar:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'estado:lista')
    runs-on: ubuntu-latest
    # La elección va en serie: dos ejecuciones a la vez podrían coger la misma historia.
    concurrency:
      group: seleccionar-historia
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: write
    outputs:
      historia: ${{ steps.elegir.outputs.historia }}
    steps:
      - uses: actions/checkout@v4
      - id: elegir
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "1"
          REPO: ${{ github.repository }}
          COLA_PAUSADA: ${{ vars.COLA_PAUSADA }}
          HISTORIAS_EN_PARALELO: ${{ vars.HISTORIAS_EN_PARALELO }}
        # Priority del tablero, luego antigüedad; salta dependencias abiertas y zonas solapadas.
        run: |
          historia=$(.github/scripts/elegir_historia.sh)
          echo "historia=$historia" >> "$GITHUB_OUTPUT"
          [ -n "$historia" ] || exit 0
          # Se reclama aquí, antes de soltar el turno, para que la siguiente elección ya la vea en curso.
          gh issue edit "$historia" -R "$REPO" --add-label estado:en-desarrollo --remove-label estado:lista >/dev/null
          echo "#$historia reclamada."
          # Si queda hueco, otra elección para llenarlo.
          gh workflow run desarrollar.yml -R "$REPO" --ref main

      - name: Reflejar la historia en el tablero
        if: steps.elegir.outputs.historia != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "1"
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.elegir.outputs.historia }}
        run: .github/scripts/sincronizar_tablero.sh

  desarrollar:
    needs: seleccionar
    if: needs.seleccionar.outputs.historia != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180  # una historia L con Opus puede pasar de hora y media
    concurrency:
      group: desarrollo-${{ needs.seleccionar.outputs.historia }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    env:
      HISTORIA: ${{ needs.seleccionar.outputs.historia }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen --extra dev

      - id: modelo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODELO_BARATO: ${{ vars.MODELO_BARATO }}
          MODELO_INTERMEDIO: ${{ vars.MODELO_INTERMEDIO }}
          MODELO_CAPAZ: ${{ vars.MODELO_CAPAZ }}
          ISSUE: ${{ env.HISTORIA }}
        run: |
          echo "modelo=$(.github/scripts/modelo.sh desarrollo "$ISSUE")" >> "$GITHUB_OUTPUT"
          echo "turnos=$(.github/scripts/modelo.sh turnos-desarrollo "$ISSUE")" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],github-actions[bot]"  # github-actions: lanzamientos de Fusionar y Desbloquear
          prompt: |
            REPO: ${{ github.repository }}
            HISTORIA: #${{ env.HISTORIA }}

            Actúa como el agente definido en .claude/agents/desarrollador.md e implementa
            la historia #${{ env.HISTORIA }} siguiendo sus instrucciones al pie de la letra,
            hasta dejar abierta la PR. No la fusiones: la fusiona el workflow Fusionar.
          claude_args: |
            --model ${{ steps.modelo.outputs.modelo }}
            --max-turns ${{ steps.modelo.outputs.turnos }}
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Edit,Write,Bash(uv:*),Bash(git:*),Bash(gh:*),Bash(curl:*),Bash(python3:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(jq:*),Bash(wc:*),Bash(ls:*),Bash(sort:*),Bash(cut:*),Bash(tr:*),Bash(echo:*),Bash(mkdir:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh api:*)"


      - name: Guardar transcripción del agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripcion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Devolver la historia a la cola si el agente falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fallos=$(gh issue view "$HISTORIA" -R "$REPO" --json comments \
            --jq '[.comments[].body | select(startswith("Fallo del agente de desarrollo"))] | length')
          if [ "$fallos" -ge 2 ]; then
            gh issue comment "$HISTORIA" -R "$REPO" --body "Fallo del agente de desarrollo (tercero): $RUN_URL. @${{ github.repository_owner }}, necesito que mires esta historia."
            gh issue edit "$HISTORIA" -R "$REPO" --remove-label "estado:en-desarrollo" --remove-label "estado:lista" --add-label "estado:necesita-fundador"
          else
            gh issue comment "$HISTORIA" -R "$REPO" --body "Fallo del agente de desarrollo: $RUN_URL. Vuelve a la cola."
            gh issue edit "$HISTORIA" -R "$REPO" --remove-label "estado:en-desarrollo" --add-label "estado:lista"
            # Si falló con el modelo barato, el reintento sube a talla M (modelo intermedio).
            if gh issue view "$HISTORIA" -R "$REPO" --json labels --jq '.labels[].name' | grep -qx 'talla:s'; then
              gh issue edit "$HISTORIA" -R "$REPO" --remove-label "talla:s" --add-label "talla:m"
            fi
          fi

      - name: Devolver a la cola una historia sin terminar
        # El agente puede acabar "bien" dejando la historia a medias (p. ej. tras guardar el avance en
        # una PR en borrador). Si sigue en estado:en-desarrollo, ocuparía un hueco para siempre: vuelve
        # a la cola y el siguiente intento continúa sobre la rama. Al tercer intento, al fundador.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! gh issue view "$HISTORIA" -R "$REPO" --json labels --jq '.labels[].name' | grep -qx 'estado:en-desarrollo'; then
            echo "#$HISTORIA avanzó de estado."; exit 0
          fi
          intentos=$(gh issue view "$HISTORIA" -R "$REPO" --json comments \
            --jq '[.comments[].body | select(startswith("Historia sin terminar"))] | length')
          if [ "$intentos" -ge 2 ]; then
            gh issue comment "$HISTORIA" -R "$REPO" --body "Historia sin terminar por tercera vez: $RUN_URL. @${{ github.repository_owner }}, necesito que mires si hay que partirla o aclarar algo."
            gh issue edit "$HISTORIA" -R "$REPO" --remove-label "estado:en-desarrollo" --add-label "estado:necesita-fundador"
          else
            gh issue comment "$HISTORIA" -R "$REPO" --body "Historia sin terminar: el agente acabó con la historia aún en desarrollo ($RUN_URL). Vuelve a la cola; el siguiente intento continúa sobre su rama y su PR en borrador."
            gh issue edit "$HISTORIA" -R "$REPO" --remove-label "estado:en-desarrollo" --add-label "estado:lista"
          fi

      - name: Seguir con la cola
        # Si el agente bloqueó la historia, la devolvió a la cola o pidió ayuda, queda un hueco libre que
        # nadie llenaría hasta el próximo merge (el cron horario de GitHub no es fiable). El selector
        # decide si hay hueco. Tras un fallo no se relanza: así una caída general no quema la cola entera.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run desarrollar.yml -R "$REPO" --ref main

  corregir:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'cambios-pedidos' &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      !contains(github.event.pull_request.labels.*.name, 'veto')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: corregir-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen --extra dev

      - id: modelo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODELO_BARATO: ${{ vars.MODELO_BARATO }}
          MODELO_INTERMEDIO: ${{ vars.MODELO_INTERMEDIO }}
          MODELO_CAPAZ: ${{ vars.MODELO_CAPAZ }}
          RAMA: ${{ github.event.pull_request.head.ref }}
        run: |
          ISSUE=$(sed -nE 's#^claude/historia-([0-9]+).*#\1#p' <<<"$RAMA")
          echo "modelo=$(.github/scripts/modelo.sh desarrollo "$ISSUE")" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],github-actions[bot]"  # github-actions: lanzamientos de Fusionar y Desbloquear
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            RAMA: ${{ github.event.pull_request.head.ref }}

            Actúa como el agente definido en .claude/agents/desarrollador.md, sección
            "Si te llaman para corregir", sobre la PR #${{ github.event.pull_request.number }}.
            Trabaja en la rama ${{ github.event.pull_request.head.ref }}, que ya está en el checkout.
          claude_args: |
            --model ${{ steps.modelo.outputs.modelo }}
            --max-turns 150
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Edit,Write,Bash(uv:*),Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(jq:*),Bash(wc:*),Bash(ls:*),Bash(sort:*),Bash(cut:*),Bash(tr:*),Bash(echo:*),Bash(mkdir:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh api:*)"

      - name: Guardar transcripción del agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripcion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 3
          if-no-files-found: ignore
