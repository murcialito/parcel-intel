name: Diseñar

# Agente arquitecto: diseña las historias con estado:diseno (talla L o con ADR) antes de desarrollo.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Número de la historia a diseñar"
        required: true

concurrency:
  group: disenar-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  disenar:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'estado:diseno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUM: ${{ github.event.issue.number || inputs.issue }}
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: modelo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODELO_BARATO: ${{ vars.MODELO_BARATO }}
          MODELO_INTERMEDIO: ${{ vars.MODELO_INTERMEDIO }}
          MODELO_CAPAZ: ${{ vars.MODELO_CAPAZ }}
        run: echo "modelo=$(.github/scripts/modelo.sh diseno "$NUM")" >> "$GITHUB_OUTPUT"

      - id: agente
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],github-actions[bot]"  # github-actions: lanzamientos de Fusionar y Desbloquear
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ env.NUM }}

            Actúa como el agente definido en .claude/agents/arquitecto.md y diseña la
            historia #${{ env.NUM }} siguiendo sus instrucciones al pie de la letra.
          claude_args: |
            --model ${{ steps.modelo.outputs.modelo }}
            --max-turns 120
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Write,Bash(gh issue:*),Bash(gh api:*),Bash(git log:*),Bash(curl:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(jq:*),Bash(wc:*),Bash(ls:*),Bash(sort:*),Bash(cut:*),Bash(tr:*),Bash(echo:*),Bash(mkdir:*)"

      - name: Guardar transcripción del agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripcion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Comprobar que el agente cambió el estado
        if: always()
        env:
          AGENTE: ${{ steps.agente.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ env.NUM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh issue view "$ISSUE" -R "$REPO" --json labels --jq '.labels[].name' | grep -qx 'estado:diseno'; then
            if [ "$AGENTE" = "failure" ]; then motivo="El agente falló (por ejemplo, se quedó sin turnos)"; else motivo="El agente terminó sin cambiar el estado"; fi
            gh issue comment "$ISSUE" -R "$REPO" --body "$motivo; la issue sigue en \`estado:diseno\`: $RUN_URL. Para reintentar: Actions → Diseñar → Run workflow con esta issue."
            echo "::error::El agente no cambió el estado (estado:diseno)."
            exit 1
          fi
