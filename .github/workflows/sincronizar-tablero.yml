name: Sincronizar tablero

# Refleja cada issue en el proyecto "Parcela Intel" (users/murcialito/projects/1):
# Status según estado:* (o Done al cerrarse), Size según talla:*, el fundador como assignee mientras
# la issue le espera y Start/Target date reales para el Roadmap (ver el script).
# Requiere el secret PROJECT_TOKEN (token clásico con permisos "repo" y "project": sin "repo" no ve las issues del repo privado);
# la issue se lee con el token del propio workflow. Sin PROJECT_TOKEN no hace nada.

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "47 5 * * *"  # refresca a diario las fechas "hoy" del Roadmap
  workflow_dispatch:
    inputs:
      issue:
        description: "Número de issue (vacío = todas)"
        required: false

permissions:
  contents: read
  issues: write  # asigna al fundador cuando una issue le espera

concurrency:
  group: tablero-${{ github.event.issue.number || inputs.issue || 'todas' }}
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "1"
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ -n "$ISSUE" ]; then exec .github/scripts/sincronizar_tablero.sh; fi
          for n in $(GH_TOKEN="$REPO_TOKEN" gh issue list -R "$REPO" --state all --limit 500 --json number --jq '.[].number'); do
            ISSUE=$n .github/scripts/sincronizar_tablero.sh
          done
