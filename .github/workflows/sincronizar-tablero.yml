name: Sincronizar tablero

# Refleja cada issue en el proyecto "Parcela Intel" (users/murcialito/projects/1):
# Status según estado:* (o Done al cerrarse) y Size según talla:*.
# Requiere el secret PROJECT_TOKEN (token con permiso "project"); sin él no hace nada.

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: tablero-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "1"
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: .github/scripts/sincronizar_tablero.sh
