name: Sincronizar tablero

# Copia la etiqueta estado:* de una issue al campo Status del proyecto de usuario.
# Requiere el secret PROJECT_TOKEN (token clásico con permiso "project"); sin él no hace nada.
# Las opciones del campo Status deben llamarse como en MAPA (ver docs/proceso.md).

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  sincronizar:
    if: startsWith(github.event.label.name, 'estado:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "1"
          ISSUE_ID: ${{ github.event.issue.node_id }}
          ETIQUETA: ${{ github.event.label.name }}
        run: .github/scripts/sincronizar_tablero.sh
