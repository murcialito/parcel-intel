name: Desplegar

# Publica site/ en GitHub Pages. Solo corre con el repo público (Pages gratis lo exige
# y el proyecto es de código abierto). Cuando exista el visor, su historia sustituirá
# el paso "Construir" por la generación real del mapa estático.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir
        run: python3 scripts/construir_sitio.py site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
