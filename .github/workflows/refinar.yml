name: Refinar

# Agente refinador: trabaja una issue con estado:refinar, o vuelve sobre ella
# cuando el fundador responde en una issue con estado:necesita-fundador.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Número de issue a retomar (relee sus comentarios)"
        required: true
      nota:
        description: "Indicación para el agente (opcional)"
        required: false

concurrency:
  group: refinar-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  refinar:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'estado:refinar') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'estado:necesita-fundador'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUM: ${{ github.event.issue.number || inputs.issue }}
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: modelo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODELO_BARATO: ${{ vars.MODELO_BARATO }}
          MODELO_INTERMEDIO: ${{ vars.MODELO_INTERMEDIO }}
          MODELO_CAPAZ: ${{ vars.MODELO_CAPAZ }}
        run: echo "modelo=$(.github/scripts/modelo.sh refinar "$NUM")" >> "$GITHUB_OUTPUT"

      - name: Foto de la issue antes del agente
        id: antes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "foto=$(gh issue view "$NUM" -R "$REPO" --json labels,comments --jq '"\([.labels[].name]|sort|join(","))|\(.comments|length)"')" >> "$GITHUB_OUTPUT"

      - id: agente
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],github-actions[bot]"  # github-actions: lanzamientos de Fusionar y Desbloquear
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ env.NUM }}
            EVENTO: ${{ github.event_name }}

            Actúa como el agente definido en .claude/agents/refinador.md y sigue sus
            instrucciones al pie de la letra sobre la issue #${{ env.NUM }}.

            Si el evento es workflow_dispatch, es un reintento: relee los comentarios y
            retoma donde se quedó (si el fundador ya respondió, aplica su respuesta).
            Indicación de quien lo relanza (puede estar vacía): ${{ inputs.nota }}

            Si el evento es un comentario, es la respuesta del fundador a tus preguntas:
            incorpórala, quita la etiqueta estado:necesita-fundador y decide de nuevo
            (lista, más preguntas o partir en hijas).

            No pongas nunca la etiqueta estado:refinar en esta misma issue: volvería a
            lanzar este workflow.
          claude_args: |
            --model ${{ steps.modelo.outputs.modelo }}
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Write,Bash(gh issue:*),Bash(gh api:*),Bash(gh label:*),Bash(git log:*),Bash(curl:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(jq:*),Bash(wc:*),Bash(ls:*),Bash(sort:*),Bash(cut:*),Bash(tr:*),Bash(echo:*),Bash(mkdir:*)"

      - name: Guardar transcripción del agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripcion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Comprobar que el agente avanzó
        if: always()
        env:
          AGENTE: ${{ steps.agente.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ANTES: ${{ steps.antes.outputs.foto }}
          SALIDA: ${{ runner.temp }}/claude-execution-output.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          despues=$(gh issue view "$NUM" -R "$REPO" --json labels,comments --jq '"\([.labels[].name]|sort|join(","))|\(.comments|length)"')
          etiquetas=${despues%|*}
          motivo=""
          if tr ',' '\n' <<<"$etiquetas" | grep -qx 'estado:refinar'; then
            motivo="sigue en \`estado:refinar\`"
          elif [ "$despues" = "$ANTES" ]; then
            motivo="no cambió etiquetas ni comentó"
          fi
          if [ "$AGENTE" = "failure" ] && [ -n "$motivo" ]; then motivo="el agente falló, p. ej. sin turnos; $motivo"; fi
          if [ -n "$motivo" ]; then
            negados=$(jq -r '[.[] | select(.type == "result") | .permission_denials[]?.tool_name] | length' "$SALIDA" 2>/dev/null || echo "?")
            gh issue comment "$NUM" -R "$REPO" --body "El agente terminó sin avanzar ($motivo; herramientas denegadas: $negados): $RUN_URL. Para reintentar: Actions → Refinar → Run workflow con esta issue."
            echo "::error::El agente no avanzó: $motivo."
            exit 1
          fi
