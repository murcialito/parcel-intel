name: Revisar

# Agente revisor. El check "revision" (nombre del job) es obligatorio para el merge:
# falla si el veredicto es CAMBIOS.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  revision:
    if: startsWith(github.event.pull_request.head.ref, 'claude/') && !github.event.pull_request.draft
    # concurrency a nivel de job y no de workflow: un job que se salta por el `if` (evento de una PR
    # aún en borrador) no entra en el grupo y no cancela la revisión real. A nivel de workflow, el
    # push y el `gh pr ready` casi simultáneos dejaron la PR #131 sin revisión (#115, 2026-11-27).
    concurrency:
      group: revisar-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen --extra dev

      - id: modelo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODELO_BARATO: ${{ vars.MODELO_BARATO }}
          MODELO_INTERMEDIO: ${{ vars.MODELO_INTERMEDIO }}
          MODELO_CAPAZ: ${{ vars.MODELO_CAPAZ }}
          RAMA: ${{ github.event.pull_request.head.ref }}
        run: |
          ISSUE=$(sed -nE 's#^claude/historia-([0-9]+).*#\1#p' <<<"$RAMA")
          echo "modelo=$(.github/scripts/modelo.sh revision "$ISSUE")" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Actúa como el agente definido en .claude/agents/revisor.md y revisa la
            PR #${{ github.event.pull_request.number }} siguiendo sus instrucciones al pie
            de la letra. Termina escribiendo el veredicto en .revision/veredicto.
          claude_args: |
            --model ${{ steps.modelo.outputs.modelo }}
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Write,Bash(gh pr:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(uv run:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(jq:*),Bash(wc:*),Bash(ls:*),Bash(sort:*),Bash(cut:*),Bash(tr:*),Bash(echo:*),Bash(mkdir:*)"


      - name: Guardar transcripción del agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripcion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Aplicar veredicto
        run: |
          veredicto=$(tr -d '[:space:]' < .revision/veredicto 2>/dev/null || echo "SIN_VEREDICTO")
          echo "Veredicto del revisor: $veredicto"
          if [ "$veredicto" != "APROBADO" ]; then
            echo "::error::Revisión: $veredicto"
            exit 1
          fi
