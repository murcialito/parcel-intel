name: Actualizar rama

# Trae main a la rama de una PR de agente que está en conflicto. GitHub no corre CI ni revisión
# sobre una PR con conflictos, así que sin esto se quedaría parada. Lo lanza
# .github/scripts/ramas_en_conflicto.sh (tras cada merge de Fusionar y en la pasada diaria) o se
# lanza a mano. El push lo hace el agente con el token de la App, que sí dispara CI y Revisar.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Número de la PR en conflicto"
        required: true

concurrency:
  group: actualizar-rama-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          datos=$(gh pr view "$PR" -R "$REPO" --json headRefName,state,labels)
          rama=$(jq -r .headRefName <<<"$datos")
          case "$rama" in claude/*) ;; *) echo "::error::La PR #$PR no es de un agente ($rama)."; exit 1 ;; esac
          if [ "$(jq -r .state <<<"$datos")" != "OPEN" ]; then echo "::error::La PR #$PR no está abierta."; exit 1; fi
          if jq -e '.labels[].name | select(. == "veto")' <<<"$datos" >/dev/null; then echo "::error::La PR #$PR tiene veto."; exit 1; fi
          echo "rama=$rama" >> "$GITHUB_OUTPUT"
          echo "historia=$(sed -nE 's#^claude/historia-([0-9]+).*#\1#p' <<<"$rama")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.rama }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen --extra dev

      - id: modelo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODELO_BARATO: ${{ vars.MODELO_BARATO }}
          MODELO_INTERMEDIO: ${{ vars.MODELO_INTERMEDIO }}
          MODELO_CAPAZ: ${{ vars.MODELO_CAPAZ }}
          ISSUE: ${{ steps.pr.outputs.historia }}
        run: echo "modelo=$(.github/scripts/modelo.sh desarrollo "$ISSUE")" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],github-actions[bot]"  # github-actions: lanzamientos de Fusionar y Desbloquear
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ inputs.pr }}
            RAMA: ${{ steps.pr.outputs.rama }}

            Actúa como el agente definido en .claude/agents/desarrollador.md, sección
            "Si tu PR está en conflicto con main", sobre la PR #${{ inputs.pr }}.
            La rama ${{ steps.pr.outputs.rama }} ya está en el checkout.
          claude_args: |
            --model ${{ steps.modelo.outputs.modelo }}
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(uv:*),Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(jq:*),Bash(wc:*),Bash(ls:*),Bash(sort:*),Bash(cut:*),Bash(tr:*),Bash(echo:*),Bash(mkdir:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh api:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git rebase:*)"

      - name: Guardar transcripción del agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripcion-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 3
          if-no-files-found: ignore
