name: Fusionar

# Único camino de merge de las PRs de agentes (ADR 0024). Se lanza cuando terminan CI o Revisar
# y fusiona solo si, sobre el último commit de la PR:
#   - el check "checks" (CI) y el check "revision" (agente revisor) están en SUCCESS;
#   - la PR no es borrador y no tiene las etiquetas veto ni cambios-pedidos;
#   - la PR está al día con main (si no, se pone al día y se espera a los checks nuevos).
# Los agentes no pueden fusionar (gh pr merge y gh api están vetados en sus herramientas).
# Como fusiona con GITHUB_TOKEN, los eventos que provoca no disparan workflows: por eso lanza
# a mano CI en main, el despliegue, la sincronización del tablero y la siguiente historia.

on:
  workflow_run:
    workflows: [CI, Revisar]
    types: [completed]
  # Una aprobación del fundador llega después de CI y Revisar: reevalúa sin intervención (ADR 0024, enmienda).
  pull_request_review:
    types: [submitted]

concurrency:
  group: fusionar-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  fusionar:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'claude/')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       startsWith(github.event.pull_request.head.ref, 'claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    steps:
      # Siempre main: con pull_request_review el checkout por defecto sería el código de la PR, y los
      # scripts de la guardia (.github/scripts/) los podría cambiar la propia PR que se evalúa.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Comprobar condiciones y fusionar
        id: fusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          PROYECTO_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$RAMA" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No hay PR abierta para $RAMA (ya fusionada o cerrada)."; exit 0; fi

          datos=$(gh pr view "$pr" -R "$REPO" --json headRefOid,isDraft,labels,statusCheckRollup,closingIssuesReferences,reviews)
          cabeza=$(jq -r '.headRefOid' <<<"$datos")
          if [ "$cabeza" != "$SHA" ]; then echo "La PR #$pr ya tiene un commit más nuevo; se decidirá con sus checks."; exit 0; fi
          if [ "$(jq -r '.isDraft' <<<"$datos")" = "true" ]; then echo "PR #$pr en borrador."; exit 0; fi
          if jq -e '.labels[].name | select(. == "veto" or . == "cambios-pedidos" or . == "pendiente-local")' <<<"$datos" >/dev/null; then
            echo "PR #$pr con veto, cambios-pedidos o pendiente-local: no se fusiona."; exit 0
          fi
          for check in checks revision; do
            # Puede haber varias ejecuciones del mismo check sobre el commit (p. ej. una saltada en borrador):
            # manda la más reciente.
            estado=$(jq -r --arg c "$check" '[.statusCheckRollup[] | select(.name == $c)] | sort_by(.startedAt // "") | last | .conclusion // "PENDIENTE"' <<<"$datos")
            if [ "$estado" != "SUCCESS" ]; then echo "Check '$check' en $estado: se espera."; exit 0; fi
          done

          # Guardia de curated/** (ADR 0024, enmienda): las aprobaciones humanas de trazados históricos
          # las da el fundador. Si la PR toca curated/, hace falta su review APPROVED sobre este commit.
          # Ficheros por la API REST paginada (gh pr view --json files se corta en 100), contando el
          # nombre anterior de los renombrados, para que nada en curated/ se escape.
          ficheros=$(gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[] | {path: .filename}, (select(.previous_filename) | {path: .previous_filename})' | jq -s '{files: .}')
          if jq -r '.files[].path' <<<"$ficheros" | bash .github/scripts/toca_curated.sh; then
            if ! bash .github/scripts/aprobada_por_fundador.sh <<<"$datos"; then
              echo "PR #$pr toca curated/**: falta la aprobación de murcialito sobre ${SHA:0:7}; no se fusiona."; exit 0
            fi
          fi

          # Con varias historias en paralelo, otra PR puede haber entrado en main después de que corriera
          # el CI de esta: sus checks no cubren la combinación real. Si va por detrás de main, se pone al
          # día (con PROJECT_TOKEN, para que el push dispare CI y Revisar) y se decide con los checks nuevos.
          detras=$(gh api "repos/$REPO/compare/main...$SHA" --jq .behind_by)
          if [ "$detras" -gt 0 ]; then
            if [ -z "${PROYECTO_TOKEN:-}" ]; then echo "::error::PR #$pr va $detras commits por detrás de main y no hay PROJECT_TOKEN para ponerla al día."; exit 1; fi
            if GH_TOKEN="$PROYECTO_TOKEN" gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$SHA" --silent; then
              echo "PR #$pr iba $detras commits por detrás de main: puesta al día; se fusionará cuando CI y la revisión pasen otra vez."
            else
              echo "PR #$pr no se pudo poner al día (¿conflicto?): la atiende Actualizar rama."
            fi
            exit 0
          fi
          gh pr merge "$pr" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA"
          # Un merge hecho con GITHUB_TOKEN no siempre cierra las issues de "Closes #n": se cierran aquí.
          historia=$(jq -r '.closingIssuesReferences[0].number // empty' <<<"$datos")
          if [ -z "$historia" ]; then historia=$(sed -nE 's#^claude/historia-([0-9]+).*#\1#p' <<<"$RAMA"); fi
          for n in $(jq -r '.closingIssuesReferences[].number' <<<"$datos") $historia; do
            gh issue edit "$n" -R "$REPO" --remove-label estado:en-revision --remove-label estado:en-desarrollo || true
            gh issue close "$n" -R "$REPO" --reason completed --comment "Fusionada en la PR #$pr." || true
          done
          echo "historia=$historia" >> "$GITHUB_OUTPUT"
          echo "fusionada=true" >> "$GITHUB_OUTPUT"
          echo "PR #$pr fusionada."

      - name: Lanzar CI en main, despliegue y siguiente historia
        if: steps.fusion.outputs.fusionada == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run ci.yml -R "$REPO" --ref main
          gh workflow run desplegar.yml -R "$REPO" --ref main
          gh workflow run desbloquear.yml -R "$REPO" --ref main
          # Etiqueta validacion-vN si entró un CONGELADO*.md (idempotente; no existe hasta fusionar #54).
          gh workflow run etiquetar-validacion.yml -R "$REPO" --ref main 2>/dev/null || echo "Sin workflow de etiquetado todavía."
          gh workflow run desarrollar.yml -R "$REPO" --ref main || echo "Desarrollar desactivado: no se lanza la siguiente historia."

      - name: Actualizar las PRs de agentes que este merge deja en conflicto
        if: steps.fusion.outputs.fusionada == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/ramas_en_conflicto.sh

      - name: Mover la historia a Done en el tablero
        continue-on-error: true  # el tablero es un reflejo; no tumba un merge ya hecho
        if: steps.fusion.outputs.fusionada == 'true' && steps.fusion.outputs.historia != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "1"
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.fusion.outputs.historia }}
        run: .github/scripts/sincronizar_tablero.sh

  ci-rojo:
    # CI en rojo sobre el último commit de una PR de agente lista para revisión: nadie la corregiría
    # (el desarrollador solo vuelve con cambios-pedidos). Se le pide como si fuera una revisión: un
    # comentario "CI: CAMBIOS" con los fallos y la etiqueta cambios-pedidos, puesta con PROJECT_TOKEN
    # para que dispare la corrección. El tope de 3 vueltas lo lleva el desarrollador.
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PROYECTO_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          datos=$(gh pr list -R "$REPO" --head "$RAMA" --state open --json number,isDraft,headRefOid,labels --jq '.[0] // empty')
          [ -n "$datos" ] || { echo "Sin PR abierta para $RAMA."; exit 0; }
          pr=$(jq -r .number <<<"$datos")
          [ "$(jq -r .isDraft <<<"$datos")" = "false" ] || { echo "PR #$pr en borrador: CI rojo esperado."; exit 0; }
          [ "$(jq -r .headRefOid <<<"$datos")" = "$SHA" ] || { echo "PR #$pr ya tiene otro commit."; exit 0; }
          if jq -e '.labels[].name | select(. == "veto" or . == "cambios-pedidos")' <<<"$datos" >/dev/null; then
            echo "PR #$pr ya tiene veto o cambios-pedidos."; exit 0
          fi
          [ -n "${PROYECTO_TOKEN:-}" ] || { echo "::error::Sin PROJECT_TOKEN no se puede lanzar la corrección."; exit 1; }
          fallos=$(gh run view "$RUN_ID" -R "$REPO" --log-failed 2>/dev/null \
            | sed -E 's/^[^\t]*\t[^\t]*\t[0-9TZ:.-]+ //' \
            | grep -E '^(FAILED|ERROR)|Error|error:|^E  ' | grep -vE '^##\[' | head -40 | cut -c1-300 || true)
          {
            echo "CI: CAMBIOS"
            echo
            echo "El CI falla en el último commit (\`${SHA:0:7}\`): $RUN_URL"
            echo
            echo "Corrige los fallos sin desactivar tests ni checks. Si un test de otra historia ha quedado obsoleto por el alcance de esta, actualízalo y explica por qué en la PR."
            echo
            echo '```'
            echo "${fallos:-(sin extracto: mira el log)}"
            echo '```'
          } > comentario.md
          gh pr comment "$pr" -R "$REPO" --body-file comentario.md
          # API REST de etiquetas: `gh pr edit` pide permisos de Projects (classic) que el token no tiene.
          GH_TOKEN="$PROYECTO_TOKEN" gh api -X POST "repos/$REPO/issues/$pr/labels" -f "labels[]=cambios-pedidos" --silent
          echo "PR #$pr: CI rojo; se pide corrección."

  pendientes:
    # Eventos de PR que se pierden y dejan una PR parada. Tras cada CI o Revisar se buscan y se relanzan,
    # con respaldo en el cron de desarrollar.yml:
    #   - cambios-pedidos puesta con la PR en conflicto con main: no hay run de pull_request y no se
    #     lanza Corregir (#114);
    #   - push y `gh pr ready` casi a la vez: el commit de cabeza se queda sin revisión (#115).
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/correcciones_pendientes.sh
      - name: Revisiones que se quedaron sin hacer
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
        run: .github/scripts/revisiones_pendientes.sh
