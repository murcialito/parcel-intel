name: Fusionar

# Único camino de merge de las PRs de agentes (ADR 0024). Se lanza cuando terminan CI o Revisar
# y fusiona solo si, sobre el último commit de la PR:
#   - el check "checks" (CI) y el check "revision" (agente revisor) están en SUCCESS;
#   - la PR no es borrador y no tiene las etiquetas veto ni cambios-pedidos;
#   - la PR está al día con main (si no, se pone al día y se espera a los checks nuevos).
# Los agentes no pueden fusionar (gh pr merge y gh api están vetados en sus herramientas).
# Como fusiona con GITHUB_TOKEN, los eventos que provoca no disparan workflows: por eso lanza
# a mano CI en main, el despliegue, la sincronización del tablero y la siguiente historia.

on:
  workflow_run:
    workflows: [CI, Revisar]
    types: [completed]

concurrency:
  group: fusionar-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fusionar:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar condiciones y fusionar
        id: fusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RAMA: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PROYECTO_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$RAMA" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No hay PR abierta para $RAMA (ya fusionada o cerrada)."; exit 0; fi

          datos=$(gh pr view "$pr" -R "$REPO" --json headRefOid,isDraft,labels,statusCheckRollup,closingIssuesReferences)
          cabeza=$(jq -r '.headRefOid' <<<"$datos")
          if [ "$cabeza" != "$SHA" ]; then echo "La PR #$pr ya tiene un commit más nuevo; se decidirá con sus checks."; exit 0; fi
          if [ "$(jq -r '.isDraft' <<<"$datos")" = "true" ]; then echo "PR #$pr en borrador."; exit 0; fi
          if jq -e '.labels[].name | select(. == "veto" or . == "cambios-pedidos")' <<<"$datos" >/dev/null; then
            echo "PR #$pr con veto o cambios-pedidos: no se fusiona."; exit 0
          fi
          for check in checks revision; do
            # Puede haber varias ejecuciones del mismo check sobre el commit (p. ej. una saltada en borrador):
            # manda la más reciente.
            estado=$(jq -r --arg c "$check" '[.statusCheckRollup[] | select(.name == $c)] | sort_by(.startedAt // "") | last | .conclusion // "PENDIENTE"' <<<"$datos")
            if [ "$estado" != "SUCCESS" ]; then echo "Check '$check' en $estado: se espera."; exit 0; fi
          done

          # Con varias historias en paralelo, otra PR puede haber entrado en main después de que corriera
          # el CI de esta: sus checks no cubren la combinación real. Si va por detrás de main, se pone al
          # día (con PROJECT_TOKEN, para que el push dispare CI y Revisar) y se decide con los checks nuevos.
          detras=$(gh api "repos/$REPO/compare/main...$SHA" --jq .behind_by)
          if [ "$detras" -gt 0 ]; then
            if [ -z "${PROYECTO_TOKEN:-}" ]; then echo "::error::PR #$pr va $detras commits por detrás de main y no hay PROJECT_TOKEN para ponerla al día."; exit 1; fi
            if GH_TOKEN="$PROYECTO_TOKEN" gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$SHA" --silent; then
              echo "PR #$pr iba $detras commits por detrás de main: puesta al día; se fusionará cuando CI y la revisión pasen otra vez."
            else
              echo "PR #$pr no se pudo poner al día (¿conflicto?): la atiende Actualizar rama."
            fi
            exit 0
          fi
          gh pr merge "$pr" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA"
          # Un merge hecho con GITHUB_TOKEN no siempre cierra las issues de "Closes #n": se cierran aquí.
          historia=$(jq -r '.closingIssuesReferences[0].number // empty' <<<"$datos")
          if [ -z "$historia" ]; then historia=$(sed -nE 's#^claude/historia-([0-9]+).*#\1#p' <<<"$RAMA"); fi
          for n in $(jq -r '.closingIssuesReferences[].number' <<<"$datos") $historia; do
            gh issue edit "$n" -R "$REPO" --remove-label estado:en-revision --remove-label estado:en-desarrollo || true
            gh issue close "$n" -R "$REPO" --reason completed --comment "Fusionada en la PR #$pr." || true
          done
          echo "historia=$historia" >> "$GITHUB_OUTPUT"
          echo "fusionada=true" >> "$GITHUB_OUTPUT"
          echo "PR #$pr fusionada."

      - name: Lanzar CI en main, despliegue y siguiente historia
        if: steps.fusion.outputs.fusionada == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run ci.yml -R "$REPO" --ref main
          gh workflow run desplegar.yml -R "$REPO" --ref main
          gh workflow run desbloquear.yml -R "$REPO" --ref main
          # Etiqueta validacion-vN si entró un CONGELADO*.md (idempotente; no existe hasta fusionar #54).
          gh workflow run etiquetar-validacion.yml -R "$REPO" --ref main 2>/dev/null || echo "Sin workflow de etiquetado todavía."
          gh workflow run desarrollar.yml -R "$REPO" --ref main || echo "Desarrollar desactivado: no se lanza la siguiente historia."

      - name: Actualizar las PRs de agentes que este merge deja en conflicto
        if: steps.fusion.outputs.fusionada == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/ramas_en_conflicto.sh

      - name: Mover la historia a Done en el tablero
        continue-on-error: true  # el tablero es un reflejo; no tumba un merge ya hecho
        if: steps.fusion.outputs.fusionada == 'true' && steps.fusion.outputs.historia != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "1"
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.fusion.outputs.historia }}
        run: .github/scripts/sincronizar_tablero.sh
